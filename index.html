<style>
  :root{
    --black:#0B0B0D;
    --panel:#151517;
    --panel-2:#1C1C1F;
    --line:#2C2A24;
    --gold:#C6A227;
    --gold-hi:#E8C766;
    --gold-dim:#8A7328;
    --paper:#F3F0E6;
    --ink:#EDEAE0;
    --mute:#948F80;
    --danger:#B4472E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--black); color:var(--ink);}
  body{
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height:100vh;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  @font-face{ /* system fallback stack is fine; using Google Fonts below via link */ }

  .app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- HEADER ---------- */
  header.top{
    padding: calc(env(safe-area-inset-top) + 18px) 20px 16px;
    background:
      linear-gradient(180deg, #141416 0%, #0B0B0D 100%);
    border-bottom: 1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  header.top::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(198,162,39,0.05) 0px, rgba(198,162,39,0.05) 2px, transparent 2px, transparent 26px);
    pointer-events:none;
  }
  .brand-row{
    display:flex; align-items:center; gap:14px; position:relative; z-index:1;
  }
  .brand-row img{
    width:52px; height:auto; flex-shrink:0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .brand-text{display:flex; flex-direction:column; gap:2px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--gold); font-weight:500;
  }
  h1.team-name{
    font-family:'Anton', 'Arial Narrow', sans-serif;
    font-size:26px; letter-spacing:0.01em; text-transform:uppercase;
    margin:0; line-height:1; color:var(--paper);
  }
  .sub-line{
    font-size:12px; color:var(--mute); margin-top:3px;
    font-family:'Work Sans', sans-serif;
  }

  /* ---------- TABS ---------- */
  nav.tabs{
    display:flex; position:sticky; top:0; z-index:20;
    background:var(--black);
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--mute);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase;
    padding:14px 8px 12px; cursor:pointer; position:relative;
    font-weight:600;
  }
  nav.tabs button.active{color:var(--gold-hi);}
  nav.tabs button.active::after{
    content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:3px;
    background:var(--gold-hi); border-radius:2px 2px 0 0;
  }

  main{flex:1; padding:16px 16px 40px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- ROSTER ---------- */
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:14px;
  }
  .search-wrap svg{flex-shrink:0; opacity:0.5;}
  .search-wrap input{
    background:none; border:none; outline:none; color:var(--ink);
    font-family:'Work Sans', sans-serif; font-size:14.5px; width:100%;
  }
  .search-wrap input::placeholder{color:var(--mute);}

  .roster-count{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--mute);
    letter-spacing:0.06em; margin:0 2px 10px; text-transform:uppercase;
  }

  .player-card{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }
  .jersey-slot{
    width:38px; height:38px; flex-shrink:0; border-radius:8px;
    border:1.5px dashed var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton', sans-serif; font-size:15px; color:var(--gold-dim);
  }
  .player-info{flex:1; min-width:0;}
  .player-name{
    font-family:'Work Sans', sans-serif; font-weight:700; font-size:15px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-name .last{color:var(--gold-hi);}

  .no-results{
    text-align:center; color:var(--mute); font-size:13.5px; padding:30px 10px;
  }

  /* ---------- SCHEDULE ---------- */
  .sched-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--mute);
    letter-spacing:0.06em; margin:2px 2px 10px; text-transform:uppercase;
  }
  .game-card{
    display:flex; align-items:flex-start; gap:13px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }
  .game-card.scrimmage{border-style:dashed; border-color:var(--gold-dim);}
  .date-slot{
    width:52px; flex-shrink:0; text-align:center;
    border-right:1px solid var(--line); padding-right:12px;
  }
  .date-slot .dow{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.06em;
    color:var(--gold); text-transform:uppercase; display:block;
  }
  .date-slot .md{
    font-family:'Anton', sans-serif; font-size:19px; color:var(--paper); line-height:1.2;
  }
  .game-info{flex:1; min-width:0;}
  .game-opp{font-family:'Work Sans', sans-serif; font-weight:700; font-size:15px; color:var(--ink);}
  .game-tag{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.05em;
    color:var(--mute); text-transform:uppercase; margin-top:3px;
  }
  .game-venue{
    display:flex; align-items:flex-start; gap:5px;
    font-family:'Work Sans', sans-serif; font-size:11.5px; color:var(--gold-hi);
    text-decoration:none; margin-top:5px; line-height:1.4;
  }
  .game-venue svg{flex-shrink:0; margin-top:2px;}
  .game-venue span{white-space:normal;}
  .loc-pill{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.07em;
    text-transform:uppercase; font-weight:700; border-radius:6px; padding:5px 9px;
    flex-shrink:0; align-self:flex-start;
  }
  .loc-pill.home{background:var(--gold); color:#151510;}
  .loc-pill.away{background:none; border:1px solid var(--line); color:var(--mute);}

  footer.foot{
    text-align:center; padding:22px 16px 30px; font-size:10.5px; color:#5a5850;
    font-family:'JetBrains Mono', monospace; letter-spacing:0.06em;
  }
</style>

  function initials(first,last){

  }

  function render(filter){
    const f = (filter||'').trim().toLowerCase();
    const sorted = [...roster].sort((a,b)=> a.last.localeCompare(b.last) || a.first.localeCompare(b.first));
    const filtered = sorted.filter(p => (p.last+' '+p.first).toLowerCase().includes(f));

    filtered.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML = `
        <div class="jersey-slot">${initials(p.first,p.last)}</div>
        <div class="player-info">
          <div class="player-name"><span class="last">${p.last}</span>, ${p.first}</div>
        </div>
      `;
      listEl.appendChild(card);
    });
    countEl.textContent = filtered.length + (filtered.length===1 ? ' player' : ' players') + (f ? ' matching "'+filter+'"' : '');
    noResultsEl.style.display = filtered.length ? 'none' : 'block';
  }

      card.className = 'game-card' + (g.tag && g.tag.toLowerCase().includes('scrimmage') ? ' scrimmage' : '');
